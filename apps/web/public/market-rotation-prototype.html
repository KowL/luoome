<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>盘中轮动 · A 股交易作战室</title>
<style>
:root{--bg:#101717;--panel:#172020;--line:#32403d;--soft:#a1b3ae;--ink:#edf4ed;--lime:#d9f199;--coral:#ffab90;--mint:#84cdb6;--mono:"IBM Plex Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Instrument Sans","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:4px}.num,time,svg text.value{font-family:var(--mono);font-variant-numeric:tabular-nums}.wrap{width:min(1260px,94vw);margin:auto}header{border-bottom:1px solid var(--line)}header .wrap,.head,.between,.transport,.date,.legend,.story{display:flex;align-items:center}header .wrap{height:51px;gap:16px}.brand{font:bold 21px var(--mono);letter-spacing:-1.6px}.logomark{color:var(--lime);font-size:19px;letter-spacing:-5px;margin-right:8px}.divider{width:1px;height:14px;background:#43534d}.sub,small{color:var(--soft)}.badge{margin-left:auto;color:#d8eab8;font-size:12px}.badge:before{content:"";display:inline-block;width:6px;height:6px;background:var(--lime);border-radius:50%;margin:0 7px 1px 0}.head,.between{justify-content:space-between}.head{padding:19px 0 13px}.head h1{font-size:clamp(25px,3vw,36px);line-height:1.15;margin:0;letter-spacing:-1px}.head p{margin:5px 0 0;color:var(--soft);font-size:12px}.clock{text-align:right}.clock time{font-size:26px;line-height:1.05}.clock small{display:block;font-size:11px}.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}.volume{padding:13px 22px 10px;margin-bottom:12px}.volume h2,.board h2{font-size:17px;margin:0}.big{font-size:24px;color:var(--lime);font-weight:600;margin-right:4px}.meter-wrap{position:relative;padding:9px 0 4px}.meter{position:relative;height:8px;background:repeating-linear-gradient(90deg,#34413b 0,#34413b calc(5% - 1px),#526051 calc(5% - 1px),#526051 5%);border-radius:12px}.fill{height:100%;background:linear-gradient(90deg,#74967c,var(--lime));border-radius:12px;position:relative}.fill:after{content:"";position:absolute;right:-4px;top:0;width:8px;height:8px;border-radius:50%;background:#eaffac;box-shadow:0 0 8px #d4f29a}.marker{position:absolute;top:-4px;height:16px;width:2px;background:#faf8df}.volfoot{font-size:11px;color:var(--soft);margin-top:4px;gap:8px}.volfoot b{font-weight:500;color:var(--ink)}.board-head{padding:15px 20px 5px;gap:10px;align-items:flex-start}.board-head p{font-size:12px;color:var(--soft);margin:3px 0}.legend{gap:13px;font-size:11px;white-space:nowrap;color:var(--soft)}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.scene{overflow-x:auto;scrollbar-width:thin}.scene svg{display:block;width:100%;min-width:740px}.story{border-top:1px solid var(--line);padding:11px 20px;gap:13px;min-height:48px}.story time{color:var(--lime);font-size:12px}.story strong{font-size:14px}.story span{color:var(--soft);font-size:12px}.playback{margin:12px 0 20px;padding:12px 18px}.transport{gap:10px}.play{background:var(--lime);color:#1d3024;font-weight:650;border-radius:6px;padding:7px 12px;min-width:76px}.action{border:1px solid #44514c;border-radius:6px;padding:6px 10px;font-size:12px}.rail{flex:1;min-width:70px;accent-color:var(--lime);cursor:pointer}.period{font-size:11px;color:var(--soft)}.chapters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chapters button{font-size:12px;padding:4px 9px;color:#abbcb4;border:1px solid transparent;border-radius:5px}.chapters button[aria-pressed=true]{background:#28362d;color:var(--lime);border-color:#465842}.chapters time{font-size:11px;margin-right:4px}.mobile{display:none}.flowfoot{font-size:11px;color:var(--soft);margin:0;padding:0 20px 9px} @media(max-width:650px){.wrap{width:95vw}.volume,.playback{padding-inline:12px}.board-head,.story{padding-inline:12px}.head{padding:14px 0 11px}.board-head{display:block}.legend{margin-top:6px}.mobile{display:inline}.story{align-items:flex-start;flex-wrap:wrap;gap:4px 10px}.story span{width:100%}.chapters{gap:0}.chapters button{padding:4px 5px}.chapters time{display:block;text-align:left}.period{display:none}.volfoot{align-items:start;font-size:10px}.flowfoot{padding-inline:12px}}
.minute-frame{display:block;width:100%;height:174px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}@media(max-width:615px){.minute-frame{height:308px}}</style>
</head>
<body>
<header><div class="wrap"><b class="brand"><span class="logomark">▂▅▇</span> luoome</b><i class="divider"></i><span>交易作战室</span><span class="badge">题材模拟回放</span></div></header>
<main class="wrap">
<div class="head"><div><h1>盘中题材轮动</h1><p>沪深 A 股 · 算力回落，机器人接力</p></div><div class="clock"><time id="clock">10:00</time><small>模拟交易时间</small></div></div>
<section class="panel volume"><div class="between"><h2>两市累计成交额 <small>模拟</small></h2><div><b class="big num" id="amount"></b> 亿元</div></div>
<div class="meter-wrap"><div class="meter" role="meter" aria-label="当日成交额，满格为昨日全天" aria-valuemin="0" aria-valuemax="9000"><div class="fill" id="fill"></div><div class="marker" id="marker"></div></div></div>
<div class="between volfoot"><span>白线 · 昨日同时点 <b id="yday" class="num"></b> 亿　<span id="diff"></span></span><span>昨日全天 <b class="num">9,000</b> 亿</span></div></section>
<iframe class="minute-frame" title="四个市场指数的真实分时行情" src="http://127.0.0.1:5173/market?view=index-minutes"></iframe>
<section class="panel board"><div class="between board-head"><div><h2>题材涨幅与成交占比</h2><p>柱高为题材日涨幅，柱内按个股涨幅排名。<span class="mobile">左右滑动可看全部题材。</span></p></div><div class="legend"><span><i style="background:var(--coral)"></i>上涨</span><span><i style="background:var(--mint)"></i>下跌</span><span><i style="background:var(--lime);border-radius:50%"></i>当前成交占比</span></div></div>
<div class="scene"><svg viewBox="0 0 1120 368" id="chart" role="img" aria-label="模拟题材涨跌幅、领涨股与各题材成交占比变化"></svg></div>
<p class="flowfoot">每根横条表示该题材近 15 分钟成交额占同期沪深 A 股成交额的比例，白线为前一个 15 分钟。四根横条共用 0–20% 刻度，题材成分可能重叠。</p>
<div class="story"><time id="chapterTime"></time><strong id="headline"></strong><span id="caption"></span></div></section>
<section class="panel playback" aria-label="播放控制"><div class="transport"><button class="play" id="play"></button><button class="action" id="reset">↺ 重播</button><time class="period">10:00</time><input id="rail" class="rail" type="range" min="0" max="60" step=".05" value="0" aria-label="拖动模拟交易时间"><time class="period">11:00</time><button id="speed" class="action num" aria-label="切换播放速度">1×</button></div><div class="chapters" id="chapters"></div></section>
</main>
<script>
'use strict';
const colors={gain:'#ffab90',loss:'#84cdb6',line:'#d9f199',muted:'#a7b8af',text:'#f1f4ed'};
const sectors=[
 {name:'算力硬件',stocks:['星垣光联','云序芯科','澜舟互连','千穹数通']},
 {name:'机器人',stocks:['棱虎机电','衡川精工','允衡传动','初石智控']},
 {name:'固态电池',stocks:['栖野材料','星铸能源','远辰电解','云岫新材']},
 {name:'航运港口',stocks:['澄屿港务','引潮海运','江临航运','云浦港务']}];
// Per sector: index return (%), share of market turnover in the trailing 15 min (%), four stock returns (%).
const frames=[
 {min:0,amt:2180,prev:2075,rows:[[2.85,14,[6.3,5.1,3.9,2.1]],[.62,4,[2.2,1.1,.8,.4]],[1.05,5.1,[2.5,2.1,1.4,.5]],[-.64,3.3,[.8,.4,-.5,-1.2]]]},
 {min:15,amt:2920,prev:2740,rows:[[3.72,16.2,[9.8,7.3,5.6,4.4]],[.94,5.5,[4.1,1.9,1.6,1.1]],[1.16,5.2,[3.2,2.4,1.6,.4]],[-.88,2.8,[1.1,.3,-.8,-1.4]]]},
 {min:30,amt:3610,prev:3375,rows:[[2.98,11.8,[7.3,5.8,3.1,4.2]],[1.58,9.8,[6.6,3.2,2.8,1.3]],[1.40,5.4,[3.5,2.7,1.9,.8]],[-1.12,2.4,[.6,.1,-1.0,-1.9]]]},
 {min:45,amt:4480,prev:4020,rows:[[1.89,8.4,[4.5,4.9,2.6,3.4]],[3.02,13.5,[8.3,7.0,6.1,3.3]],[1.57,5.7,[3.7,3.0,2.3,1.0]],[-.82,2.6,[.3,.7,-.8,-1.3]]]},
 {min:60,amt:5290,prev:4740,rows:[[1.12,6.6,[2.4,3.4,1.9,3.8]],[4.08,16.8,[8.8,9.7,7.9,5.2]],[1.84,6,[4.5,3.6,2.7,1.7]],[-.60,2.9,[.5,1.0,-.4,-1.0]]]}
];
const chapters=[
 {min:0,name:'算力领涨',note:'算力硬件涨幅居首，近 15 分钟成交额占全市场的 14.0%。'},
 {min:15,name:'算力冲高',note:'算力成交占比升至 16.2%，星垣光联领涨。'},
 {min:30,name:'机器人启动',note:'算力涨幅仍为正，成交占比已从 16.2% 降至 11.8%。机器人占比升至 9.8%，棱虎机电率先拉升。'},
 {min:45,name:'机器人接力',note:'机器人涨幅超过算力，成交占比升至 13.5%，衡川精工、允衡传动跟涨。'},
 {min:60,name:'领涨股换位',note:'机器人涨幅扩大到 4.08%，衡川精工超过棱虎机电，成为题材涨幅第一。'}
];
const $=id=>document.getElementById(id);
const time=m=>m>=60?'11:00':'10:'+String(Math.floor(m)).padStart(2,'0');
const signed=(n,d=2)=>(n>0?'+':'')+n.toFixed(d)+'%';
const mix=(a,b,p)=>a+(b-a)*p;
const svgText=(x,y,s,opts='')=>'<text x="'+x+'" y="'+y+'" '+opts+'>'+s+'</text>';
let minute=0, playing=!matchMedia('(prefers-reduced-motion: reduce)').matches, speed=1,last=null,lastPaint=-Infinity,chapter=-1;
function draw(rows){
 const base=232,scale=42, centers=[178,435,692,949], width=168;
 let svg='<title>模拟时间 '+time(minute)+'，题材涨幅、领涨股与成交占比</title><defs><linearGradient id="up" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#954f3c"/><stop offset="1" stop-color="#44302a"/></linearGradient><linearGradient id="down" x2="0" y2="1"><stop stop-color="#254f45"/><stop offset="1" stop-color="#326e60"/></linearGradient></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif">';
 for(const tick of [4,2,0,-1]){
  const y=base-tick*scale;
  svg+='<path d="M54 '+y+'H1090" stroke="'+(tick===0?'#8a9a90':'#34403c')+'" '+(tick===0?'':'stroke-dasharray="3 6"')+'/>'+svgText(44,y+4,(tick>0?'+':'')+tick+'%','text-anchor="end" class="value" font-size="11" fill="'+colors.muted+'"');
 }
 rows.forEach(({ret,stocks},i)=>{
  const x=centers[i], h=Math.abs(ret)*scale, y=ret>=0?base-h:base, color=ret>=0?colors.gain:colors.loss;
  svg+=svgText(x,22,sectors[i].name,'text-anchor="middle" fill="'+colors.text+'" font-size="17" font-weight="640"');
  svg+='<rect x="'+(x-width/2)+'" y="'+y+'" width="'+width+'" height="'+h+'" rx="3" fill="url(#'+(ret>=0?'up':'down')+')"/>';
  const edge=base-ret*scale;
  svg+='<path d="M'+(x-width/2)+' '+edge+'h'+width+'" stroke="'+color+'" stroke-width="2.5"/>';
  svg+=svgText(x,ret>=0?edge-7:base-8,signed(ret),'text-anchor="middle" class="value" font-size="16" font-weight="650" fill="'+color+'"');
  const ranked=stocks.map((r,j)=>({name:sectors[i].stocks[j],r})).sort((a,b)=>b.r-a.r);
  const count=Math.min(3,Math.floor(h/19));
  ranked.slice(0,Math.max(count,1)).forEach((s,j)=>{
    const labelY=count?y+15+j*19:(ret>=0?base+17:edge+16);
    svg+=svgText(x-76,labelY,s.name,'fill="'+colors.text+'" font-size="12"')+svgText(x+76,labelY,signed(s.r,1),'text-anchor="end" class="value" fill="'+colors.text+'" font-size="12"');
  });
 });
 rows.forEach(({share,previous},i)=>{
  const x=centers[i],left=x-width/2,delta=share-previous;
  const textStyle='text-anchor="middle" font-size="12" fill="'+colors.muted+'"';
  svg+=svgText(x,304,'成交占比 '+share.toFixed(1)+'%',textStyle);
  svg+='<rect x="'+left+'" y="314" width="'+width+'" height="7" rx="3" fill="#304038"/>';
  svg+='<rect x="'+left+'" y="314" width="'+(width*share/20)+'" height="7" rx="3" fill="'+colors.line+'"/>';
  const mark=left+width*previous/20;
  svg+='<path d="M'+mark+' 310v15" stroke="#fff" stroke-width="2"/>';
  svg+=svgText(x,346,'较前窗 '+(delta>0?'+':'')+delta.toFixed(1)+' 个百分点',textStyle);
 });
 $('chart').innerHTML=svg+'</g>';
}
function render(){
 const i=Math.min(3,Math.floor(minute/15)),a=frames[i],b=frames[i+1],p=(minute-a.min)/15;
 const amt=Math.round(mix(a.amt,b.amt,p)), prev=Math.round(mix(a.prev,b.prev,p));
 $('amount').textContent=amt.toLocaleString('en-US');$('yday').textContent=prev.toLocaleString('en-US');$('diff').textContent='较昨日 '+signed((amt/prev-1)*100,1);
 $('marker').style.left=prev/90+'%';$('fill').style.width=amt/90+'%';document.querySelector('.meter').setAttribute('aria-valuenow',amt);
 $('clock').textContent=time(minute);$('rail').value=minute;$('rail').setAttribute('aria-valuetext',time(minute));
 const earlier=i>0?frames[i-1].rows.map(row=>row[1]):[12,3.6,5,3.7];
 draw(a.rows.map(([ret,share,stocks],j)=>({
  ret:mix(ret,b.rows[j][0],p),
  share:mix(share,b.rows[j][1],p),
  previous:mix(earlier[j],share,p),
  stocks:stocks.map((v,k)=>mix(v,b.rows[j][2][k],p))
 })));
 const stage=Math.min(4,Math.floor(minute/15));if(stage!==chapter){chapter=stage;const c=chapters[stage];$('chapterTime').textContent=time(c.min);$('headline').textContent=c.name;$('caption').textContent=c.note;Array.from($('chapters').children).forEach((el,i)=>el.setAttribute('aria-pressed',String(i===stage)));}
 $('play').textContent=playing?'Ⅱ 暂停':'▶ 播放';$('speed').textContent=speed+'×';
}
let raf;
function advance(ts){
 if(last!==null)minute=Math.min(60,minute+(ts-last)*.0015*speed);
 last=ts;
 if(minute>=60)playing=false;
 if(ts-lastPaint>=32 || !playing){render();lastPaint=ts;}
 if(playing)raf=requestAnimationFrame(advance);
}
function update(t,run){cancelAnimationFrame(raf);minute=t;playing=run;last=null;render();if(playing)raf=requestAnimationFrame(advance);}
chapters.forEach(c=>{const btn=document.createElement('button');btn.innerHTML='<time>'+time(c.min)+'</time>'+c.name;btn.onclick=()=>update(c.min,false);$('chapters').append(btn);});
$('play').onclick=()=>update(minute===60?0:minute,!playing);
$('reset').onclick=()=>update(0,true);
$('speed').onclick=()=>{speed=speed === 1 ? 2 : speed === 2 ? 0.5 : 1;update(minute,playing);};
$('rail').oninput=e=>update(Number(e.target.value),false);
document.addEventListener('visibilitychange',()=>{last=null;});
update(30,playing);
</script></body></html>
