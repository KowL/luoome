  return rows.map(([ret, up, share, sealed, stage], i) => {

    return { ret, m15: +m15.toFixed(2), up, total, share, shareDelta: +shareDelta.toFixed(1), sealed, stage };

}

// Reuse securities across the theme and industry views, but retain each
// industry's own breadth, returns and window turnover.
function industryStock(themeIndex, stockIndex) {
  const stock = THEMES[themeIndex].stocks[stockIndex];
  const evidence = stock.returns.map((ret, i) => {
    const sign = ret > 0 ? '+' : '';
    const signChange = i > 0 && ret < stock.returns[i - 1] ? '较上个时点走低' : '较上个时点抬升';
    const movement = i === 0 ? '首个观察时点' : ret === stock.returns[i - 1] ? '与上个时点持平' : signChange;
    return `${movement}，涨跌幅 ${sign}${ret.toFixed(2)}%，累计成交 ${stock.amounts[i].toFixed(1)} 亿。`;
  });
  return { ...stock, evidence };
}

function renderRotationChart(frame) {
  const series = THEMES.slice(0, 3);
  const left = 47;
  const right = 684;
  const top = 15;
  const bottom = 153;
  const stockReturns = series.flatMap(theme => theme.frames.slice(0, frame + 1).map(point => point.ret));
  const minimum = Math.min(0, ...stockReturns);
  const maximum = Math.max(1, ...stockReturns);
  const roughStep = (maximum - minimum) / 4;
  const magnitude = 10 ** Math.floor(Math.log10(roughStep));
  const tickStep = [1, 2, 2.5, 5, 10].find(step => step * magnitude >= roughStep) * magnitude;
  const low = Math.floor(minimum / tickStep) * tickStep;
  const high = Math.ceil(maximum / tickStep) * tickStep;
  const x = index => left + (right - left) * index / (TIMES.length - 1);
  const y = value => bottom - ((value - low) / (high - low)) * (bottom - top);
  const format = (value, digits) => (value > 0 ? '+' : '') + value.toFixed(digits) + '%';
  const parts = [
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 185" width="100%" style="display:block;height:auto" aria-label="三个题材截至' + TIMES[frame] + '的日内涨跌幅走势">',
    '<defs><linearGradient id="room-chart-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + series[0].color + '" stop-opacity=".115"/><stop offset="100%" stop-color="' + series[0].color + '" stop-opacity="0"/></linearGradient></defs>',
    '<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a4b6b7" font-variant-numeric="tabular-nums">'
  ];

  for (let tick = low; tick <= high + tickStep / 2; tick += tickStep) {
    const position = y(tick);
    const zero = Math.abs(tick) < 0.0001;
    const label = (tick > 0 ? '+' : '') + Number(tick.toFixed(2)) + '%';
    parts.push('<line x1="' + left + '" x2="' + right + '" y1="' + position + '" y2="' + position + '" stroke="' + (zero ? '#638083' : '#405457') + '" stroke-opacity="' + (zero ? '.72' : '.64') + '"' + (zero ? '' : ' stroke-dasharray="2 5"') + '/>');
    parts.push('<text x="' + (left - 8) + '" y="' + (position + 4) + '" text-anchor="end">' + label + '</text>');
  }

  TIMES.forEach((time, index) => {
    const axisColor = index === frame ? '#edf3ed' : index < frame ? '#a4b6b7' : '#7d9293';
    const position = x(index);
    parts.push('<line x1="' + position + '" x2="' + position + '" y1="' + top + '" y2="' + bottom + '" stroke="#4a6061" stroke-opacity=".32" stroke-dasharray="2 6"/>');
    parts.push('<text x="' + position + '" y="177" fill="' + axisColor + '" text-anchor="middle">' + time + '</text>');
  });

  const latestX = x(frame);
  parts.push('<line x1="' + latestX + '" x2="' + latestX + '" y1="' + top + '" y2="' + (bottom + 3) + '" stroke="#b9c9c5" stroke-opacity=".52" stroke-dasharray="3 5"/>');
  const seriesInfo = series.map(theme => {
    const values = theme.frames.slice(0, frame + 1).map(point => point.ret);
    return {theme, values, latest: values[frame], endY: y(values[frame])};
  });
  seriesInfo.forEach(({theme, values, latest, endY}, seriesIndex) => {
    const trace = values.map((value, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(value).toFixed(1)).join(' ');
    if (seriesIndex === 0 && frame > 0) {
      parts.push('<path d="' + trace + ' L' + latestX + ',' + y(0) + ' L' + left + ',' + y(0) + ' Z" fill="url(#room-chart-area)"/>');
    }
    parts.push('<path d="' + trace + '" fill="none" stroke="' + theme.color + '" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><title>' + theme.name + ' 截至 ' + TIMES[frame] + ' ' + format(latest, 2) + '</title></path>');
    parts.push('<circle cx="' + latestX + '" cy="' + endY + '" r="4.1" fill="' + theme.color + '" stroke="#15272b" stroke-width="1.6"/>');
  });

  if (frame === TIMES.length - 1) {
    const labels = [...seriesInfo].sort((a, b) => a.endY - b.endY);
    labels.forEach((item, i) => { item.labelY = i === 0 ? item.endY : Math.max(item.endY, labels[i - 1].labelY + 15); });
    if (labels[labels.length - 1].labelY > bottom) {
      labels[labels.length - 1].labelY = bottom;
      for (let i = labels.length - 2; i >= 0; i--) labels[i].labelY = Math.min(labels[i].labelY, labels[i + 1].labelY - 15);
    }
    labels.forEach(({theme, latest, endY, labelY}) => {
      parts.push('<path d="M' + (right + 5) + ',' + endY + ' L' + (right + 12) + ',' + labelY + '" fill="none" stroke="' + theme.color + '" stroke-opacity=".65"/>');
      parts.push('<text x="' + (right + 15) + '" y="' + (labelY + 4) + '" fill="' + theme.color + '" font-size="12">' + format(latest, 2) + '</text>');
    });
  }

  const hitWidth = (right - left) / (TIMES.length - 1);
  TIMES.slice(0, frame + 1).forEach((time, index) => {
    const start = Math.max(left, x(index) - hitWidth / 2);
    const end = Math.min(right + 4, x(index) + hitWidth / 2);
    parts.push('<rect data-chart-frame="' + index + '" x="' + start + '" y="' + top + '" width="' + (end - start) + '" height="' + (bottom - top + 28) + '" fill="transparent" style="cursor:pointer"><title>' + time + ' · 查看时点快照</title></rect>');
  });
  parts.push('</g></svg>');
  return parts.join('');
}

 const rows=ordered.map((group,i)=>{
  const f=group.frames[state.frame];
  return '<tr data-row="'+group.id+'" class="'+(state.group===group.id?'selected':'')+'"><td><button class="rowbtn" data-group="'+group.id+'" aria-pressed="'+(state.group===group.id)+'"><span class="rank">'+String(i+1).padStart(2,'0')+'</span><span class="tname">'+group.name+'</span></button></td><td class="numeric '+tint(f.ret)+'">'+pct(f.ret)+'</td><td class="numeric '+tint(f.m15)+'">'+pct(f.m15)+'</td><td class="numeric">'+f.up+'/'+f.total+'</td><td class="optional numeric">'+f.share.toFixed(1)+'%</td><td>'+chip(f.stage)+'</td></tr>';
 }).join('');
 return '<section class="panel"><div class="table-head">'+head('板块强弱榜','list',switcher())+'<div class="table-meta"><small class="hint">'+activeGroups().length+' 个'+scopeName()+'样本 · 选择一行查看核心股</small><select id="sort" class="sorter" aria-label="榜单排序">'+sortOptions+'</select></div></div><div class="board"><table><thead><tr><th>'+scopeName()+'</th><th>日涨幅</th><th>近 15 分</th><th>上涨/有效</th><th class="optional">成交占比¹</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function stats(items){
 return '<div class="detail-stat">'+items.map(([label,value,cls])=>'<div><small>'+label+'</small><strong class="'+(cls||'')+'">'+value+'</strong></div>').join('')+'</div>';
}
function details(){
 const g=activeGroup(),f=g.frames[state.frame];
 const stockList=g.stocks.map(s=>'<button class="stock" data-stock="'+s.id+'"><span class="role">'+s.role+'</span><span class="name">'+s.name+'</span><span class="numeric '+tint(s.returns[state.frame])+'">'+pct(s.returns[state.frame])+'</span><span class="arrow">›</span></button>').join('');
 return '<aside class="panel detail" id="detail" tabindex="-1"><div class="section-head"><span class="detail-caption">'+scopeName()+'详情</span><span class="at-time mono">'+TIMES[state.frame]+'</span></div><div class="detail-top"><h2>'+g.name+'</h2>'+chip(f.stage)+'</div>'+stats([['当日涨幅',pct(f.ret),tint(f.ret)],['上涨家数',f.up+' / '+f.total],['封板家数',f.sealed+' 家']])+'<div class="stock-head"><h3>核心观察股</h3><small class="hint">点击查看依据</small></div>'+stockList+'</aside>';
}
function trackingEvidence(){
 const g=activeGroup(), f=g.frames[state.frame], previous=state.frame>0?g.frames[state.frame-1]:undefined;
 const items=timelineEvents().filter(event=>event.theme===g.id);
 const description=previous?'本窗口上涨 '+f.up+' 家，上一窗口 '+previous.up+' 家。成交占比从 '+previous.share.toFixed(1)+'% 变为 '+f.share.toFixed(1)+'%。':'首个采样窗口，上涨 '+f.up+' / '+f.total+' 家，成交占比 '+f.share.toFixed(1)+'%。';
 return '<section class="panel panelpad lower" style="margin-top:15px">'+head(g.name+' · 当时依据','pulse')+'<p>'+description+'</p>'+(items.length?eventList(items.slice(0,3)):'<p class="footnote">截至 '+TIMES[state.frame]+'，该'+scopeName()+'没有已记录的独立事件。</p>')+'</section>';
}
function fundPanel(){
 const ordered=activeGroups().slice().sort((a,b)=>b.frames[state.frame].share-a.frames[state.frame].share);
 const peak=ordered[0].frames[state.frame].share;
 const rows=ordered.map(g=>{
  const f=g.frames[state.frame];
  return '<button class="fund-row" data-group="'+g.id+'" aria-pressed="'+(g.id===state.group)+'"><strong>'+g.name+'</strong><span class="bar"><i style="width:'+f.share/peak*100+'%;background:'+(state.group===g.id?'#38735d':'#8aad98')+'"></i></span><span class="fund-number">'+f.share.toFixed(1)+'%</span><span class="fund-number '+(state.frame?tint(f.shareDelta):'')+'">'+(state.frame?signed(f.shareDelta,1):'—')+'</span></button>';
 }).join('');
 return '<section class="panel panelpad">'+head('成交集中在哪些方向','money',switcher())+'<p class="hint">最近 15 分钟，各'+scopeName()+'成交额占同期沪深 A 股成交额的比例。</p><div class="fund-row fund-head fund-label"><span>'+scopeName()+'</span><span>按窗口占比排序</span><span style="text-align:right">占比</span><span style="text-align:right">环比百分点</span></div>'+rows+'<p class="footnote">成交占比反映交易活跃度。'+(state.scope==='themes'?'同一只股票可属于多个题材，各题材占比可重叠。':'此处列出四个行业样本。')+'</p></section>';
}
function render(){
 byId('clock').textContent=TIMES[state.frame];
 byId('time-label').textContent=state.frame===TIMES.length-1?'最新模拟快照':'历史模拟快照';
 document.querySelectorAll('[data-nav]').forEach(el=>el.setAttribute('aria-current',el.dataset.nav===state.view?'page':'false'));
 replayBar();metrics();
 const intro=state.view==='overview'?'':'<div class="focus-intro"><button class="linkbtn" data-nav="overview">'+icon('back')+' 市场总览</button><p>'+TIMES[state.frame]+' · '+(state.view==='funds'?'成交额按窗口统计':'板块与核心股按同一时点展示')+'</p></div>';
 const upper=state.view==='overview'?'<div class="grid">'+chartPanel()+eventsPanel()+'</div>':'';
 const content=state.view==='funds'?fundPanel():ranking();
 const note=state.view==='funds'?'':'<p class="footnote">¹ 最近 15 分钟板块成交额占同期沪深 A 股成交额的比例。</p>';
 byId('content').innerHTML=intro+upper+'<div class="grid lower">'+content+details()+'</div>'+note+(state.view==='themes'?trackingEvidence():'');
}
function changeGroup(id, mobileJump){
 state.group=id;state.scope=THEMES.some(g=>g.id===id)?'themes':'industries';
 render();
 if(mobileJump && matchMedia('(max-width:720px)').matches) byId('detail').scrollIntoView({block:'start'});
}
function jumpToGroup(id){
 state.view='themes';changeGroup(id,false);
 window.scrollTo({top:0,behavior:'instant'});
}
function closeDialog(){byId('dialog').close();}
function showDialog(contents){
 byId('dialog-content').innerHTML=contents;
 if(!byId('dialog').open) byId('dialog').showModal();
}
function modalHead(label){
 return '<div class="dialog-head"><span class="detail-caption">'+label+'</span><button class="xbtn" data-dismiss autofocus aria-label="关闭">×</button></div>';
}
function stockDialog(id){
 const g=activeGroup(), s=g.stocks.find(stock=>stock.id===id), i=state.frame;
 const history=TIMES.slice(0,i+1).map((time,j)=>'<div class="histrow"><time class="mono">'+time+'</time><b class="numeric '+tint(s.returns[j])+'">'+pct(s.returns[j])+'</b><span>'+s.evidence[j]+'</span></div>').reverse().join('');
 showDialog(modalHead(g.name+' ／ 核心股依据')+'<div class="dialog-title"><h2 id="dialog-title">'+s.name+'</h2><span class="chip">'+s.role+'</span></div><small class="hint">模拟标识 '+s.id+' · '+TIMES[i]+'</small>'+stats([['当日涨幅',pct(s.returns[i]),tint(s.returns[i])],['累计成交额',money(s.amounts[i])+' 亿'],['所属'+scopeName(),g.name]])+'<h3>当时依据</h3><p class="evidence">'+s.evidence[i]+'</p><h3 style="margin-bottom:8px">截至该时点的观察</h3><div class="history">'+history+'</div><div class="dialog-actions"><button class="btn" data-dismiss>返回'+g.name+'</button></div>');
}
function allEvents(){
 showDialog(modalHead('盘中回放')+'<h2 id="dialog-title">截至 '+TIMES[state.frame]+' 的动态</h2><p class="hint">选择事件，查看它发生时的板块与核心股。</p>'+eventList(timelineEvents()));
}
document.addEventListener('click',e=>{
 const target=e.target.closest('button,[data-chart-frame],tr[data-row]');
 if(e.target===byId('dialog')){closeDialog();return;}
 if(!target || target.disabled) return;
 const d=target.dataset;
 if(d.dismiss!==undefined){closeDialog();return;}
 if(d.events!==undefined){allEvents();return;}
 if(d.event!==undefined){
  const event=EVENTS.find(item=>item.id===d.event);
  if(byId('dialog').open) closeDialog();
  state.frame=event.frame;state.replay=true;jumpToGroup(event.theme);return;
 }
 if(d.stock!==undefined){stockDialog(d.stock);return;}
 if(d.nav!==undefined){state.view=d.nav;render();window.scrollTo({top:0,behavior:'instant'});return;}
 if(d.openGroup!==undefined){jumpToGroup(d.openGroup);return;}
 if(d.group!==undefined||d.row!==undefined){changeGroup(d.group||d.row,true);return;}
 if(d.scope!==undefined){state.scope=d.scope;state.group=activeGroups()[0].id;render();return;}
 if(target.id==='replay-toggle'){state.replay=!state.replay;render();return;}
 if(d.latest!==undefined){state.frame=TIMES.length-1;state.replay=false;render();return;}
 if(d.time!==undefined||d.chartFrame!==undefined){state.frame=Number(d.time??d.chartFrame);state.replay=true;render();}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;render();byId('sort').focus();}});
render();

</script>
</body></html>
