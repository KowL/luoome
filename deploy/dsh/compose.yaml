# 默认部署 = 纯插件 Web + Caddy：DSH 用 Node 加载 dsh-luoome 插件（host/client/skills），
# Caddy 提供公网入口。运行期没有 MCP 实例、Bun CLI、旧 Bun Web、analysis worker 或
# queue probe；旧 MCP/Bun 入口只保留源码（P5 再删除），不在本文件启动。
# 插件经 deploy/dsh/profile-seed.mjs 装配进 DSH profile，事实库为 Node SQLite。
x-service: &service
  image: luoome-dsh:${LUOOME_RELEASE:?set an immutable release tag}
  build:
    context: ../..
    dockerfile: deploy/dsh/Dockerfile
    args:
      # BUN_IMAGE 只用于构建阶段打包插件；运行阶段是 Node 镜像。
      BUN_IMAGE: ${BUN_IMAGE:?set a pinned Bun image}
      NODE_IMAGE: ${NODE_IMAGE:-node:22.22.3-bookworm-slim}
      DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
  restart: unless-stopped
  # 容器日志默认无上限，DSH 会话与工具输出长期累积会把磁盘吃满。
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 120s
  environment: &environment
    DSH_HOME: /var/lib/dsh
    DSH_WORKSPACE: /workspace
    DSH_PROFILE: ${DSH_PROFILE:-luoome-web}
    LUOOME_HOME: /var/lib/luoome
    # owner 与事实库账户由部署显式绑定；缺失即 fail closed，不从请求/模型推断。
    LUOOME_OWNER_USER_ID: ${LUOOME_OWNER_USER_ID:?set the trusted owner user id}
    LUOOME_OWNER_ACCOUNT_ID: ${LUOOME_OWNER_ACCOUNT_ID:?set the existing owner account id}
    LUOOME_MARKET_PROVIDER: ${LUOOME_MARKET_PROVIDER:-real}
    LUOOME_STOCK_UNIVERSE_SOURCES: ${LUOOME_STOCK_UNIVERSE_SOURCES:-eastmoney,sina}
  volumes:
    - dsh_home:/var/lib/dsh
    - dsh_workspace:/workspace
    - luoome_home:/var/lib/luoome
  # DSH 会把 cordis 插件加载器的 napi 原生绑定物化到 tmp 再 dlopen，
  # Docker 默认的 tmpfs 带 noexec，会报 "failed to map segment from shared object"。
  tmpfs: [/tmp:exec]
  networks: [backend]

services:
  # 纯插件 Web：Node 运行 DSH + dsh-luoome（三面板 client + 四技能 + 原生工具/审批）。
  dsh-web:
    <<: *service
    command: ["deploy/dsh/entrypoint.sh", "web"]
    environment:
      <<: *environment
      DSH_BIND_HOST: ${DSH_BIND_HOST:-172.28.0.5}
      DSH_PORT: ${DSH_PORT:-3080}
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:?set the advertised public root}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:?set the browser-visible authority}
    networks:
      backend:
        ipv4_address: 172.28.0.5
  # 公网入口：basic auth + 反代。DSH 自己不发布端口，只在这里对外。
  caddy:
    image: ${CADDY_IMAGE:?set a reviewed Caddy image tag or digest}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DSH_PUBLIC_IP: ${DSH_PUBLIC_IP:-134.175.83.56}
      # Caddyfile 用 {$DSH_AUTH_HASH:unset} 兜底，而 unset 不是合法 base64，
      # 缺变量会让 Caddy 启动失败并进入崩溃循环。
      # 这里显式要求这两个变量，缺一个就直接拒绝启动，而不是等到线上才发现。
      DSH_AUTH_USER: ${DSH_AUTH_USER:?set the DSH basic auth user}
      DSH_AUTH_HASH: ${DSH_AUTH_HASH:?set the DSH basic auth hash}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.28.0.2

networks:
  # 栈内网络：Caddy 才能反代到 DSH，且不额外发布端口。
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.128/25
volumes:
  dsh_home:
  dsh_workspace:
  luoome_home:
  caddy_data:
  caddy_config:
