name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: typecheck + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for DSH integration tests
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Architecture boundaries
        run: bun run check:layers

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:all

      - name: Lint
        run: bun run lint

  plugin-install:
    name: plugin install (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 插件安装验收要在 Node 24 下跑：产物走 node:sqlite，Node 22 的 API 面不同。
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plugin install acceptance
        run: bun run test:plugin-install
